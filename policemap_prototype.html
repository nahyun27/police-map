<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폴리스맵 — 국민 참여형 수사기관 평가 플랫폼 (프로토타입)</title>
<style>
  :root{
    --navy:#1f3864; --navy2:#2d4d85; --blue:#3b6fc4; --bg:#f5f7fa;
    --line:#e2e8f0; --txt:#1e293b; --sub:#64748b; --gold:#f5b301;
    --green:#15803d; --red:#b91c1c; --amber:#b45309;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6}
  a{color:var(--blue);text-decoration:none;cursor:pointer}
  .demo-banner{background:#7c2d12;color:#fff;text-align:center;font-size:12.5px;padding:6px 12px}
  header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
  .hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
  .logo{font-size:21px;font-weight:800;letter-spacing:-.5px;color:#fff;cursor:pointer}
  .logo span{color:var(--gold)}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:#cbd5e1;padding:6px 11px;border-radius:6px;font-size:13.5px}
  nav a:hover,nav a.on{background:rgba(255,255,255,.14);color:#fff}
  .search{margin-left:auto;display:flex;gap:6px}
  .search input{border:none;border-radius:6px;padding:7px 12px;width:200px;font-size:13.5px}
  .search button{background:var(--gold);border:none;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
  h1{font-size:24px;color:var(--navy);margin-bottom:6px}
  h2{font-size:18px;color:var(--navy);margin-bottom:12px}
  h3{font-size:15.5px;margin-bottom:8px}
  .sub{color:var(--sub);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.search input{width:130px}}
  .kpi{text-align:center;padding:18px 8px}
  .kpi .num{font-size:26px;font-weight:800;color:var(--navy)}
  .kpi .lbl{font-size:12.5px;color:var(--sub)}
  /* tile map */
  .tilemap{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:430px;margin:10px auto}
  .tile{aspect-ratio:1;border-radius:9px;background:#dbe4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;border:2px solid transparent}
  .tile:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
  .tile b{font-size:13px}
  .tile small{font-size:10px;opacity:.75}
  .tile.empty{background:transparent;cursor:default;pointer-events:none}
  .badge{display:inline-block;background:#eef2f9;color:var(--navy);border-radius:20px;padding:2px 10px;font-size:12px;margin-right:6px}
  .badge.green{background:#dcfce7;color:var(--green)}
  .badge.amber{background:#fef3c7;color:var(--amber)}
  .badge.red{background:#fee2e2;color:var(--red)}
  .stars{color:var(--gold);letter-spacing:1px}
  table.list{width:100%;border-collapse:collapse;font-size:14px}
  table.list th{background:#f1f5f9;text-align:left;padding:9px 12px;font-size:13px;color:var(--sub)}
  table.list td{padding:11px 12px;border-top:1px solid var(--line)}
  table.list tr:hover td{background:#f8fafc}
  .btn{display:inline-block;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.sm{padding:6px 13px;font-size:13px}
  .crumb{font-size:13px;color:var(--sub);margin-bottom:14px}
  .review{border-top:1px solid var(--line);padding:14px 2px}
  .review .meta{font-size:12.5px;color:var(--sub);margin-bottom:4px}
  .bar{height:9px;background:#e8edf5;border-radius:5px;overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .barrow .lb{width:110px;color:var(--sub)}
  .barrow .vl{width:34px;text-align:right;font-weight:700}
  .notice{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:13px 16px;font-size:13px;color:#78350f;margin-bottom:16px}
  .guidebox{background:#eef2f9;border-radius:10px;padding:14px 16px;font-size:13.5px;margin:12px 0}
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
  .field input[type=text],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
  .field textarea{min-height:120px}
  .starpick{display:flex;gap:4px;font-size:26px;cursor:pointer;color:#cbd5e1}
  .starpick span.on{color:var(--gold)}
  .warn{color:var(--red);font-size:13px;margin-top:6px;display:none}
  .steps{counter-reset:s}
  .steps li{list-style:none;position:relative;padding:0 0 18px 44px}
  .steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  footer{background:var(--navy);color:#94a3b8;font-size:12.5px;text-align:center;padding:26px 20px;line-height:1.9}
  footer a{color:#cbd5e1}
  .tag{font-size:11.5px;background:#f1f5f9;border-radius:4px;padding:1px 7px;color:var(--sub);margin-left:6px}
  .flex{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0}
  .modal-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--green);border-radius:10px;padding:16px;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="demo-banner">⚠ 데모 프로토타입 — 본 화면의 모든 관서·인물·평가·통계는 <b>가상의 샘플 데이터</b>이며 실존 인물·기관과 무관합니다.</div>
<header>
  <div class="hwrap">
    <div class="logo" onclick="go('home')">폴리스<span>맵</span></div>
    <nav id="nav">
      <a data-r="home" onclick="go('home')">지도 탐색</a>
      <a data-r="stats" onclick="go('stats')">통계</a>
      <a data-r="guide" onclick="go('guide')">권리구제 안내</a>
      <a data-r="remedy" onclick="go('remedy')">민원 연계</a>
      <a data-r="policy" onclick="go('policy')">운영원칙</a>
    </nav>
    <div class="search">
      <input id="q" placeholder="경찰서·수사관 검색" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">검색</button>
    </div>
  </div>
</header>
<main id="app"></main>
<footer>
  폴리스맵(가칭) 프로토타입 · 국민 참여형 수사기관 평가 플랫폼<br>
  <a onclick="go('policy')">이용약관</a> · <a onclick="go('policy')">커뮤니티 가이드라인</a> · <a onclick="go('policy')">개인정보처리방침</a> · <a onclick="go('policy')">삭제·정정 요청</a><br>
  본 사이트는 공무집행의 투명성 제고라는 공익 목적으로 직무수행 관련 정보만을 다루며, 사생활 정보는 게재하지 않습니다.
</footer>

<script>
/* ================= 샘플 데이터 (전부 가상) ================= */
const REGIONS = [
 {id:'seoul',   name:'서울',    full:'서울경찰청',     stations:31},
 {id:'busan',   name:'부산',    full:'부산경찰청',     stations:15},
 {id:'daegu',   name:'대구',    full:'대구경찰청',     stations:11},
 {id:'incheon', name:'인천',    full:'인천경찰청',     stations:10},
 {id:'gwangju', name:'광주',    full:'광주경찰청',     stations:5},
 {id:'daejeon', name:'대전',    full:'대전경찰청',     stations:6},
 {id:'ulsan',   name:'울산',    full:'울산경찰청',     stations:5},
 {id:'sejong',  name:'세종',    full:'세종경찰청',     stations:1},
 {id:'ggs',     name:'경기남부', full:'경기남부경찰청', stations:31},
 {id:'ggn',     name:'경기북부', full:'경기북부경찰청', stations:13},
 {id:'gangwon', name:'강원',    full:'강원경찰청',     stations:17},
 {id:'chungbuk',name:'충북',    full:'충북경찰청',     stations:12},

 {id:'jeonnam', name:'전남',    full:'전남경찰청',     stations:22},
 {id:'gyeongbuk',name:'경북',   full:'경북경찰청',     stations:23},
 {id:'gyeongnam',name:'경남',   full:'경남경찰청',     stations:23},

];
/* 타일 지도 배치 (7열 그리드, null=빈칸) */
const TILE = [
 null,null,'ggn','gangwon',null,null,null,
 null,'seoul','ggs',null,null,null,null,
 'incheon','sejong','chungbuk','gyeongbuk',null,null,null,
 null,'chungnam','daejeon','daegu','ulsan',null,null,
 'jeonbuk','gwangju','gyeongnam','busan',null,null,null,
 'jeonnam',null,null,null,null,null,null,
 'jeju',null,null,null,null,null,null
];
const STATIONS = [
 {id:'s1', region:'seoul', name:'서울강남경찰서(샘플)', depts:['수사과 경제1팀','수사과 경제2팀','형사과 강력팀','사이버수사팀','여성청소년과'], rating:3.4, reviews:128},
 {id:'s2', region:'seoul', name:'서울마포경찰서(샘플)', depts:['수사과 경제팀','형사과','사이버수사팀'], rating:3.8, reviews:86},
 {id:'s3', region:'seoul', name:'서울서초경찰서(샘플)', depts:['수사과 경제1팀','형사과 강력팀','여성청소년과'], rating:3.1, reviews:104},
 {id:'s4', region:'ggs',  name:'수원남부경찰서(샘플)', depts:['수사과 경제팀','형사과','사이버수사팀'], rating:3.6, reviews:71},
 {id:'s5', region:'busan', name:'부산해운대경찰서(샘플)', depts:['수사과','형사과','여성청소년과'], rating:3.9, reviews:54},
];
const OFFICERS = [
 {id:'o1', station:'s1', name:'김가상', rank:'경위', dept:'수사과 경제1팀', rating:{fair:3.2,proc:3.5,att:2.9,comm:2.7,speed:3.1}, n:23,
   history:['2024.02 서울강남경찰서 수사과(샘플)','2021.07 서울수서경찰서 형사과(샘플)'], src:'이용자 제보(사건서류 검증)'},
 {id:'o2', station:'s1', name:'이허구', rank:'경사', dept:'사이버수사팀', rating:{fair:4.1,proc:4.3,att:4.4,comm:3.9,speed:3.6}, n:17,
   history:['2023.08 서울강남경찰서 사이버수사팀(샘플)'], src:'관서 홈페이지 공개정보'},
 {id:'o3', station:'s2', name:'박모형', rank:'경감', dept:'수사과 경제팀', rating:{fair:3.7,proc:3.9,att:3.8,comm:3.5,speed:3.2}, n:31,
   history:['2022.01 서울마포경찰서 수사과(샘플)','2019.02 서울서부경찰서 수사과(샘플)'], src:'인사발령 공고'},
 {id:'o4', station:'s3', name:'최예시', rank:'경위', dept:'형사과 강력팀', rating:{fair:2.8,proc:3.0,att:2.5,comm:2.4,speed:3.3}, n:19,
   history:['2023.07 서울서초경찰서 형사과(샘플)'], src:'이용자 제보(사건서류 검증)'},
 {id:'o5', station:'s4', name:'정샘플', rank:'경사', dept:'사이버수사팀', rating:{fair:4.4,proc:4.5,att:4.6,comm:4.2,speed:4.0}, n:12,
   history:['2024.01 수원남부경찰서 사이버수사팀(샘플)'], src:'관서 홈페이지 공개정보'},
];
const REVIEWS = [
 {officer:'o1', role:'고소인', type:'사기(경제)', date:'2026.07', stars:3,
  text:'보완수사 요청 후 3개월간 진행 상황 연락이 없어 직접 여러 차례 문의해야 했습니다. 조사 자체는 절차에 따라 진행되었고 진술 기회는 충분히 부여되었습니다.'},
 {officer:'o1', role:'피의자 변호인', type:'사기(경제)', date:'2026.05', stars:4,
  text:'조사 전 진술거부권 등 권리 고지가 정확했고, 변호인 참여에 협조적이었습니다. 조서 열람 시간도 충분히 보장했습니다.'},
 {officer:'o2', role:'피해자', type:'사이버 명예훼손', date:'2026.06', stars:5,
  text:'접수 단계부터 절차를 상세히 설명해 주었고, 처리 경과를 문자로 먼저 안내해 주었습니다. 압수물 환부 절차도 신속했습니다.'},
 {officer:'o4', role:'고소인', type:'폭행', date:'2026.04', stars:2,
  text:'조사 중 고소인 진술을 자주 끊었고, 제출한 증거자료 일부가 기록에 반영되지 않아 이의를 제기해야 했습니다. 불송치 이유 설명이 부족했습니다.'},
 {officer:'o5', role:'고소인', type:'전자상거래 사기', date:'2026.08', stars:5,
  text:'계좌 추적 진행 상황을 단계별로 안내받았습니다. 출석 일정 조율에도 유연하게 응해 주었습니다.'},
];
const BANNED = ['쓰레기','무능','멍청','개','새끼','미친','병신','죽어'];

/* ================= 라우터 ================= */
const app = document.getElementById('app');
let state = {};
function go(route, param){ state={route,param}; render(); window.scrollTo(0,0); }
function nav(r){ document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===r)); }
function stars(v){ const f=Math.round(v); return '★'.repeat(f)+'☆'.repeat(5-f); }
function avg(r){ return ((r.fair+r.proc+r.att+r.comm+r.speed)/5).toFixed(1); }
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const r = state.route || 'home';
  nav(['home','stats','guide','remedy','policy'].includes(r)?r:'');
  if(r==='home') return home();
  if(r==='region') return region(state.param);
  if(r==='station') return station(state.param);
  if(r==='officer') return officer(state.param);
  if(r==='write') return write(state.param);
  if(r==='stats') return statsPage();
  if(r==='guide') return guide();
  if(r==='remedy') return remedyPage(state.param);
  if(r==='policy') return policy();
  if(r==='search') return searchPage(state.param);
}

/* ================= 메인 ================= */
function home(){
  const tiles = TILE.map(t=>{
    if(!t) return '<div class="tile empty"></div>';
    const rg = REGIONS.find(x=>x.id===t);
    return `<div class="tile" onclick="go('region','${rg.id}')"><b>${rg.name}</b><small>${rg.stations}서</small></div>`;
  }).join('');
  const recent = REVIEWS.slice(0,3).map(rv=>{
    const o = OFFICERS.find(x=>x.id===rv.officer); const s=STATIONS.find(x=>x.id===o.station);
    return `<div class="review"><div class="meta">${s.name} · ${o.dept} · ${rv.role} · ${rv.date}</div>
      <span class="stars">${'★'.repeat(rv.stars)}${'☆'.repeat(5-rv.stars)}</span> ${esc(rv.text.slice(0,80))}…
      <a onclick="go('officer','${o.id}')">더보기</a></div>`;
  }).join('');
  app.innerHTML = `
  <div class="card" style="background:linear-gradient(135deg,#1f3864,#2d4d85);color:#fff;border:none">
    <h1 style="color:#fff;font-size:27px">수사 절차의 투명성, 국민이 만듭니다</h1>
    <p style="opacity:.85;max-width:640px">전국 경찰관서·수사부서의 공개정보와 수사 절차를 직접 경험한 국민의 구조화된 평가를 한곳에 모았습니다.
    비방이 아닌 <b>직무수행에 대한 사실 기반 평가</b>, 그리고 <b>권리구제 절차 안내</b>를 제공합니다.</p>
    <div style="margin-top:14px"><button class="btn" style="background:var(--gold);color:#1f2937" onclick="go('remedy')">권리구제 내비게이터</button>
    <button class="btn line" style="border-color:#fff;color:#fff;background:transparent;margin-left:8px" onclick="go('guide')">기피신청 안내</button>
    <button class="btn line" style="border-color:#fff;color:#fff;background:transparent;margin-left:8px" onclick="go('stats')">전국 통계</button></div>
  </div>
  <div class="grid3">
    <div class="card kpi"><div class="num">258</div><div class="lbl">등록 경찰서(샘플)</div></div>
    <div class="card kpi"><div class="num">1,742</div><div class="lbl">수사부서(샘플)</div></div>
    <div class="card kpi"><div class="num">12,308</div><div class="lbl">누적 평가(샘플)</div></div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>지도에서 찾기</h2>
      <p class="sub">시·도경찰청을 선택하면 관할 경찰서 목록으로 이동합니다.</p>
      <div class="tilemap">${tiles}</div>
    </div>
    <div class="card">
      <h2>최근 등록된 평가</h2>
      <p class="sub">모든 평가는 작성 후 검수(24~48시간)를 거쳐 게시됩니다.</p>
      ${recent}
      <hr class="divider">
      <h3>공지</h3>
      <p class="sub">· [안내] 평가는 사건관계인·변호인만 작성할 수 있습니다.<br>

/* ================= 경찰서 ================= */
function station(id){
  const s = STATIONS.find(x=>x.id===id);
  const rg = REGIONS.find(x=>x.id===s.region);
  const officers = OFFICERS.filter(o=>o.station===id);
  const orows = officers.length? officers.map(o=>`
    <tr onclick="go('officer','${o.id}')" style="cursor:pointer">
      <td><a>${o.name} ${o.rank}</a><span class="tag">${o.src}</span></td>
      <td>${o.dept}</td>
      <td><span class="stars">${stars(+avg(o.rating))}</span> ${avg(o.rating)}</td>
      <td>${o.n}건</td>
    </tr>`).join('')
    : '<tr><td colspan="4" class="sub">등록된 수사관 정보가 없습니다.</td></tr>';

  <div class="crumb"><a onclick="go('home')">홈</a> › <a onclick="go('region','${s.region}')">${rg.full}</a> › ${s.name}</div>
  <div class="card">

    <p class="sub" style="margin-top:8px">항목: 공정성 / 절차 준수 / 조사 태도 / 소통·응대 / 신속성 (각 5점)</p>

      ${orows}
    </table>
  </div>`;
}

function bars(r){
  const items=[['공정성',r.fair],['절차 준수',r.proc],['조사 태도',r.att],['소통·응대',r.comm],['신속성',r.speed]];
  return items.map(([l,v])=>{v=Math.max(0,Math.min(5,v));return `
   <div class="barrow"><div class="lb">${l}</div><div class="bar"><i style="width:${v/5*100}%"></i></div><div class="vl">${v.toFixed(1)}</div></div>`}).join('');
}

    </div>
    <div class="field"><label>본인 확인 <span class="tag">데모에서는 생략</span></label>
      <button class="btn line sm" onclick="alert('데모: 실서비스에서는 휴대폰 본인인증이 진행됩니다.')">휴대폰 본인인증</button></div>

        <select id="w-role"><option>고소인</option><option>피해자</option><option>피의자</option><option>참고인</option><option>변호인</option></select></div>

      <div class="field"><label>절차 준수(권리 고지 등)</label>${starRow('proc')}</div>
      <div class="field"><label>조사 태도</label>${starRow('att')}</div>
      <div class="field"><label>소통·연락 응대</label>${starRow('comm')}</div>
      <div class="field"><label>신속성</label>${starRow('speed')}</div>
    </div>

      <div class="warn" id="w-warn"></div>
    </div>
    <button class="btn" onclick="submitReview()">검수 요청(제출)</button>
    <div class="modal-ok" id="w-ok"><b>제출 완료(데모)</b><br>작성하신 평가는 커뮤니티 가이드라인 적합성 검수(24~48시간) 후 게시됩니다. 부적합 판정 시 사유와 함께 반려됩니다.

  </div>`;
}
function setStar(k,i){
  pick[k]=i;
  document.querySelectorAll(`.starpick[data-k="${k}"] span`).forEach((el,idx)=>el.classList.toggle('on', idx<i));
}
function checkText(){
  const t = document.getElementById('w-text').value;
  const hit = BANNED.filter(b=>t.includes(b));
  const w = document.getElementById('w-warn');
  if(hit.length){ w.style.display='block'; w.textContent=`⚠ 게시 불가 표현이 감지되었습니다: "${hit.join('", "')}" — 인신공격·경멸적 표현은 모욕죄에 해당할 수 있으며 게시가 거부됩니다. 사실 중심으로 수정해 주세요.`; }
  else w.style.display='none';
}
function submitReview(){
  const t = document.getElementById('w-text').value;
  if(BANNED.some(b=>t.includes(b))){ checkText(); return; }
  if(Object.values(pick).every(v=>v===0)){ alert('별점 항목을 1개 이상 입력해 주세요.'); return; }
  document.getElementById('w-ok').style.display='block';
}

function remedyPage(officerId){
  const o = officerId ? OFFICERS.find(x=>x.id===officerId) : null;
  const s = o ? STATIONS.find(x=>x.id===o.station) : null;
  const ctx = o ? `<div class="guidebox" style="margin-top:10px">선택된 맥락: <b>${s.name} ${o.dept} ${o.name} ${o.rank}</b> 관련 경험을 바탕으로 안내합니다. (데모)</div>` : '';
  app.innerHTML = `
  <div class="card" style="background:linear-gradient(135deg,#1f3864,#2d4d85);color:#fff;border:none">
    <h1 style="color:#fff">권리구제 내비게이터</h1>
    <p style="opacity:.85;max-width:680px">후기 작성에서 끝내지 마세요. 겪으신 문제 유형을 선택하면 <b>국민신문고·기피신청 등 공식 권리구제 절차</b> 중
    맞는 채널과 신청 방법을 안내해 드립니다. 폴리스맵은 절차 정보를 안내할 뿐, 민원 제출은 이용자 본인이 공식 창구에서 직접 진행합니다.</p>
  </div>
  <div class="card">
    <h2>어떤 문제를 겪으셨나요?</h2>${ctx}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
      ${REMEDY.map(r=>`<button class="btn line sm" id="rm-${r.id}" onclick="remedySel('${r.id}')">${r.q}</button>`).join('')}
    </div>
    <div id="rm-result"></div>
  </div>
  <div class="card">
    <h2>공식 채널 한눈에 보기</h2>
    <table class="list">
      <tr><th>채널</th><th>대상 사안</th><th>접수처</th><th>처리 특성</th></tr>
      <tr><td>국민신문고</td><td>태도·미통지 등 일반 민원</td><td>epeople.go.kr</td><td>7~14일 내 처리·회신</td></tr>
      <tr><td>청문감사인권관</td><td>비위·부당처리 상담, 기피 접수</td><td>전국 각 경찰서</td><td>수사부서와 분리 심사</td></tr>
      <tr><td>수사관 기피신청</td><td>불공정 수사 염려</td><td>청문감사(인권)담당관실</td><td>수용 시 수사관 교체</td></tr>
      <tr><td>수사심의신청</td><td>절차·결과의 적정성</td><td>시·도경찰청 수사심의계</td><td>심의 후 시정</td></tr>
      <tr><td>불송치 이의신청</td><td>불송치 결정 불복</td><td>해당 경찰서</td><td>검찰 송치 효과</td></tr>
      <tr><td>인권위 진정</td><td>조사 중 인권침해</td><td>국가인권위 (1331)</td><td>조사 후 권고</td></tr>
      <tr><td>권익위 신고</td><td>부패·공익신고</td><td>국민권익위</td><td>신고자 보호 적용</td></tr>
      <tr><td>감찰 제보</td><td>중대 비위</td><td>경찰청·시도청 감찰</td><td>감찰 조사</td></tr>
    </table>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>민원 진행 현황 보드(익명 통계 · 샘플)</h2>
      ${[['국민신문고 민원',128],['기피신청',54],['불송치 이의신청',41],['인권위 진정',12]].map(([k,v])=>`
        <div class="barrow"><div class="lb" style="width:120px">${k}</div><div class="bar"><i style="width:${v/128*100}%"></i></div><div class="vl" style="width:44px">${v}건</div></div>`).join('')}
      <p class="sub" style="margin-top:10px">이용자가 자발적으로 공유한 민원 진행 결과를 개인 식별 없이 관서·유형 단위로만 통계화합니다(샘플).</p>
    </div>
    <div class="card">
      <h2>이용 전 꼭 확인하세요</h2>
      <p class="sub">· 허위 사실에 기초한 신고·고소는 <b>무고죄</b> 등 법적 책임이 발생할 수 있습니다. 사실에 근거해 작성하세요.<br>
      · 폴리스맵이 제공하는 서식은 <b>자가 작성 지원용 안내 템플릿</b>이며, 서류 작성 대행·제출 대행은 하지 않습니다.<br>
      · 본 안내는 일반적 법률정보로, 구체적 사안의 판단은 변호사 상담이 필요합니다.</p>
    </div>
  </div>`;
}
function remedySel(id){
  const r = REMEDY.find(x=>x.id===id);
  document.querySelectorAll('[id^="rm-"]').forEach(b=>{ if(b.tagName==='BUTTON') b.style.background = b.id==='rm-'+id ? '#eef2f9' : ''; });
  document.getElementById('rm-result').innerHTML = `
  <div class="card" style="margin-top:16px;border-left:4px solid var(--gold)">
    <h2>추천 절차: ${r.ch}</h2>
    <p class="sub" style="margin-top:2px">근거: ${r.base} · 접수처: ${r.to}</p>
    <p style="margin-top:10px">${r.how}</p>
    <div class="guidebox"><b>실무 팁</b> — ${r.tip}</div>
    <div style="margin-top:12px">
      <button class="btn" onclick="alert('데모: 실서비스에서는 항목을 채우면 완성되는 자가 작성용 ${r.ch} 템플릿이 제공됩니다.\\n(서류 작성·제출 대행이 아닌 정보 제공입니다)')">서식 템플릿 열기</button>
      <button class="btn line" style="margin-left:6px" onclick="alert('데모: 실서비스에서는 공식 접수처(국민신문고 등) 링크로 이동합니다.')">공식 접수처 바로가기</button>
      <button class="btn line" style="margin-left:6px" onclick="alert('데모: 진행 결과를 익명 통계로 공유하는 화면으로 이동합니다.')">진행 결과 공유(익명)</button>
    </div>
    <p class="sub" style="margin-top:12px">이 단계에서 변호사 조력이 필요하신가요? <a onclick="go('guide')">변호사 광고 보기</a> <span class="tag">광고</span></p>
  </div>`;
}

/* ================= 운영원칙 ================= */

  <div class="card">
    <h1>운영 원칙</h1>
    <p class="sub">폴리스맵은 공무집행의 투명성 제고라는 공익 목적을 위해 다음 원칙에 따라 운영됩니다.</p>
  </div>
  <div class="grid2">
    <div class="card"><h2>게시물 원칙</h2>
      <p>· 전량 <b>선검수 후게시</b>(24~48시간)<br>· 직무수행 관련 사실 중심 서술만 게시<br>· 인신공격·사생활·허위사실 게시 거부<br>· 사건관계인·변호인만 작성 가능(경험 검증)<br>· 휴대폰 본인인증 기반 작성(작성자 책임)</p></div>
    <div class="card"><h2>개인정보 원칙</h2>
      <p>· 게재 정보는 <b>성명·계급·소속 등 직무 관련 정보로 한정</b><br>· 사진·연락처·나이·가족·SNS 등 사생활 정보 게재 금지<br>· 모든 정보에 출처(공고·홈페이지·언론·검증 제보) 관리<br>· 정보주체의 열람·정정·삭제 요구권 보장</p></div>
    <div class="card"><h2>당사자 보호 절차</h2>
      <p>· 삭제·정정 요청 전용 창구 운영<br>· 접수 즉시 <b>임시조치(블라인드)</b> 후 10일 내 재검토<br>· 처리 결과 양측 통지, 전 과정 기록 보존<br>· 분기별 투명성 보고서(게시·반려·삭제 건수) 공개</p></div>
    <div class="card"><h2>중립성</h2>
      <p>· 긍정·부정 평가의 동등한 노출<br>· 광고와 콘텐츠의 명확한 구분 표시<br>· 특정 사건·변호사 알선 금지(정액 광고만 운영)<br>· 운영진의 개별 게시물 개입 기록화</p></div>
  </div>`;
}

/* ================= 검색 ================= */
function doSearch(){ const q=document.getElementById('q').value.trim(); if(q) go('search', q); }
function searchPage(q){
  const st = STATIONS.filter(s=>s.name.includes(q));
  const of = OFFICERS.filter(o=>o.name.includes(q)||o.dept.includes(q));
  app.innerHTML = `
  <div class="card"><h1>"${esc(q)}" 검색 결과</h1></div>
  <div class="card"><h2>경찰서 (${st.length})</h2>
    ${st.length? st.map(s=>`<div class="review"><a onclick="go('station','${s.id}')">${s.name}</a> <span class="sub">평가 ${s.reviews}건</span></div>`).join(''):'<p class="sub">결과 없음</p>'}
  </div>
  <div class="card"><h2>수사관 (${of.length})</h2>
    ${of.length? of.map(o=>{const s=STATIONS.find(x=>x.id===o.station);return `<div class="review"><a onclick="go('officer','${o.id}')">${o.name} ${o.rank}</a> <span class="sub">${s.name} ${o.dept}</span></div>`}).join(''):'<p class="sub">결과 없음</p>'}
  </div>`;
}

render();
</script>
